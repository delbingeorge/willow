services:
  postgres:
    image: postgres:16-alpine
    container_name: willow-db 
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: willow 
      POSTGRES_USER: willow 
      POSTGRES_PASSWORD: willow 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willow -d willow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
